<script>
// Advice from owned status parts; inlined into the page by guide.py and tested by guide_test.js.
// owned: Set of "Status|part"; a status without numbered parts is counted as "Status|1".."Status|n"
// ch: {n, letter, part}

function count(owned, s) {
  let n = 0;
  for (const k of owned) if (k.startsWith(s + "|")) n++;
  return n;
}

function has(owned, s, p) {
  return p != null ? owned.has(s + "|" + p) : count(owned, s) > 0;
}

function condOk(owned, ch, [s, p, want, min]) {
  // "Time Passes" with no chapter means the part for the chapter being played
  if (s === "Time Passes") s = "Time Passes: Chapter " + ch.n;
  return (min ? count(owned, s) >= min : has(owned, s, p)) === want;
}

function chapterOk(ch, [a, b, letter, part, further]) {
  const sameStep = (!letter || letter === ch.letter);
  if (further) return ch.n > a || (ch.n === a && sameStep && (!part || ch.part >= part));
  return ch.n >= a && ch.n <= b && sameStep && (!part || ch.part === part);
}

// heroes: Set of character names in the party; a gate naming several needs any one of them
function openGates(data, owned, ch, heroes) {
  return data.gates.filter(g =>
    g.conds.every(c => condOk(owned, ch, c)) &&
    (!g.heroes.length || g.heroes.some(h => heroes.has(h))) &&
    (!g.chapter.length || g.chapter.some(c => chapterOk(ch, c))) &&
    g.reach.some(([s, p]) => !owned.has(s + "|" + p)));
}

// a lead stays relevant while its thread has not moved past the part gained next to it
function activeLeads(data, owned) {
  const top = {};
  for (const k of owned) {
    const [s, p] = k.split("|");
    top[s] = Math.max(top[s] || 0, +p || 0);
  }
  return data.leads.filter(l => l.hide
    ? l.keys.some(([s, p]) => has(owned, s, p)) && !l.hide.some(([s, p]) => has(owned, s, p))
    : l.keys.some(([s, p]) => owned.has(s + "|" + p) && top[s] === p));
}


// Compact state for a link: one bit per sheet box, packed into base36 with a layout version.
// Only letters, digits and "-" survive in an artifact link's #hash, so the code uses nothing else.
const COUNT_BITS = 3;  // tallies of statuses without numbered parts go up to 7
const HEROES_ALL = ["Elgan", "Gerdwyn", "Iunis", "Osbert"];

function layout(data) {
  const statuses = Object.keys(data.max_part).filter(s => s !== "Time Passes").sort();
  const locs = Object.keys(data.loc_names).map(Number).sort((a, b) => a - b);
  let h = 2166136261;  // FNV-1a over the layout: a link from another data build is refused, not misread
  for (const c of JSON.stringify([statuses.map(s => [s, data.max_part[s]]), locs])) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  return { statuses, locs, ver: h.toString(36).slice(0, 4) };
}

function encodeState(data, state) {
  const { statuses, locs, ver } = layout(data);
  const owned = new Set(state.owned), bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >> i) & 1); };
  for (const s of statuses) {
    if (data.max_part[s]) for (let p = 1; p <= data.max_part[s]; p++) bits.push(owned.has(s + "|" + p) ? 1 : 0);
    else put(Math.min(count(owned, s), 2 ** COUNT_BITS - 1), COUNT_BITS);
  }
  put(state.ch.n, 4); put(["", "A", "B"].indexOf(state.ch.letter), 2); put(state.ch.part, 3);
  for (const h of HEROES_ALL) bits.push(state.heroes.includes(h) ? 1 : 0);
  for (const l of locs) bits.push(state.onMap.includes(l) ? 1 : 0);
  return "t" + ver + "-" + BigInt("0b1" + bits.join("")).toString(36);  // leading 1 keeps leading zeros
}

function decodeState(data, code) {
  const m = /^t([0-9a-z]{1,4})-([0-9a-z]+)$/.exec(code);
  if (!m) throw new Error("format");
  const { statuses, locs, ver } = layout(data);
  if (m[1] !== ver) throw new Error("version");
  let n = 0n;
  for (const c of m[2]) n = n * 36n + BigInt(parseInt(c, 36));
  const bits = n.toString(2).slice(1);
  let i = 0;
  const take = k => { let v = 0; for (let j = 0; j < k; j++) v = v * 2 + +(bits[i++] === "1"); return v; };
  const owned = [];
  for (const s of statuses) {
    if (data.max_part[s]) { for (let p = 1; p <= data.max_part[s]; p++) if (take(1)) owned.push(s + "|" + p); }
    else for (let p = 1, c = take(COUNT_BITS); p <= c; p++) owned.push(s + "|" + p);
  }
  const ch = { n: take(4), letter: ["", "A", "B", ""][take(2)], part: take(3) };
  const heroes = HEROES_ALL.filter(() => take(1));
  const onMap = locs.filter(() => take(1));
  if (i !== bits.length) throw new Error("length");
  return { owned, ch, heroes, onMap, sample: false };
}

if (typeof module !== "undefined") module.exports = { encodeState, decodeState, count, has, condOk, chapterOk, openGates, activeLeads };

取报酬。 新线索： 奇怪的歌声会与冥尘共鸣，想办法利用这一点。","keys":[["Champion of the Smallfolk",1],["Songs of Avalon",1]],"hide":[["Curios",4]],"locs":[]},{"at":"999/152","text":"返回避难之地获取报酬。 新线索： 奇怪的歌声会与冥尘共鸣。如果你能想办法增强音量，将会得到……出人意料的结果。","keys":[["Champion of the Smallfolk",1],["Songs of Avalon",1]],"hide":[["Curios",4]],"locs":[108]},{"at":"999/199","text":"无论是要让洛锡安恢复繁荣，或完成你的个人目标，你都必须找到克劳戴因并将他绳之以法。从被击退时留下的路径看，他应该是从城堡往未完之城去了。","keys":[["Avalon’s Future",1],["Avalon’s Future",2],["Avalon’s Future",3]],"hide":[["Facing the Ruin",1],["Forbidden Land",1]],"locs":[137,217]},{"at":"999/233","text":"把书还给奥芙瑞德，或者选择私吞。","keys":[["Insolent",3]],"hide":[["Small Favor",8]],"locs":[116]},{"at":"999/342","text":"洛锡安中的一片新区域开放了，你可以通过淹没的堤道（ 122 ）抵达那里。 新线索（戈德温）： 在洛锡安的东南部有个佣兵营地，那里也许和重组的铁壁战团有关！ 如果本地点上有骰子，移除该骰子。无论是否移除骰子，选择一项：","keys":[["Family Secrets",7],["Family Secrets",8],["Family Secrets",9],["Family Secrets",10]],"hide":[["Topography",6]],"locs":[216]},{"at":"105/1","text":"你必须另寻方式通过马车堡，以抵达北方的御道。 重要： 你刚完成了一个主线任务，并开始进行下一个。《污痕圣杯》是一款开放世界冒险游戏，玩家可以同时尝试多个支线任务和不同的方向。根据你的选择，部分章节可能会耗时更久。所以这就是为何在完成章节中的重要部分后，探索日志会提示你 “现在是暂停的好时机” 。如果你看到这样的提示，请考虑暂停游戏并存档。因为要前往下一个推荐的存档点，可能会再花上好几个小时！ 注意： 你也可以在推荐的存档点外存档，但会需要更多步骤，或者记录更多的信息。如果需要存档，建议选择在一天之中开始时。 现在是暂停的好时机！你可以存档，或是选择继续游戏。","keys":[["Obstacles",1]],"hide":[["Small Favor",2],["Friend of Nobility",2]],"locs":[105]},{"at":"105/2","text":"通往北方的道路已经打开！","keys":[["Obstacles",1]],"hide":[["Small Favor",2],["Friend of Nobility",2]],"locs":[105]},{"at":"120/3","text":"你可以打破洛锡安城堡主楼大门上的符文了。","keys":[["Keys & Passwords",1]],"hide":[["Notable Deeds",4]],"locs":[120]},{"at":"124/12","text":"提示： 如果想要拜访未完之城内的更多地点，请在 时进入此处。但要注意，虽然索雷斯的居民不会在冥尘出现时上街，但浓雾也有可能挡住一些现在能进入的地区。","keys":[["Builders of Sorlois",3],["Builders of Sorlois",4]],"hide":[["Notable Deeds",5]],"locs":[124]},{"at":"999/281","text":"你现在知道了“蜜圣”的含义，但这片大地上说不定有人会愿意做这件事？","keys":[["Negotiator",7]],"hide":[["Cold Heart",5],["Cold Heart",6]],"locs":[129]},{"at":"999/288","text":"给蜜蜂们找个愿意当“蜜圣”的人。","keys":[["Negotiator",7]],"hide":[["Cold Heart",5],["Cold Heart",6]],"locs":[129]},{"at":"121/2","text":"你可以去寻找这股混入了冥尘的水的源头。","keys":[["Strange Lessons",4]],"hide":[["Failures of the Unknighted",1]],"locs":[121]}],"summaries":{},"sources":{},"chapter_refs":{"6A:3":["999/27"],"4:3":["999/78","117/17"],"7B:3":["999/109","156/7"],"5:4":["999/95"],"2:2":["999/112"],"9A:2":["999/144"],"1:7":["999/164","105/2"],"END 2":["999/190"],"4:4":["999/199"],"6B:2":["999/256"],"END 6A":["999/274"],"6B:4":["999/306"],"2:1":["999/314"],"4:2":["999/329"],"8B:2":["999/349","1001/911","1001/1226"],"8B:1":["999/371"],"7B:4":["999/386"],"7B:5":["999/386"],"END 1":["999/410"],"3:2":["999/450"],"6A:2":["999/455"],"3:3":["999/478"],"7B:2":["999/487"],"6B:3":["999/503"],"7A:1":["999/505"],"END 6B":["999/534"],"5:2":["999/546"],"END 3":["999/550"],"END 4":["999/600"],"7A:3":["1001/649"],"END 5":["1001/799"],"8A:4":["1001/806"],"8A:5":["1001/809","1001/811"],"END 7A":["1001/873"],"7A:2":["1001/877"],"END 7B":["1001/913"],"9B:2":["1001/949"],"9B:6":["1001/961"],"END 8A":["1001/963"],"8A:3":["1001/983"],"8A:2":["1001/994"],"8A:1":["1001/998"],"END 9A":["1001/1006"],"9B:3":["1001/1015"],"9A:4":["1001/1034"],"9A:3":["1001/1060"],"10:2":["1001/1067"],"9A:5":["1001/1090"],"END 8B":["1001/1092"],"1:6":["105/1"],"9B:5":["137/21"],"6A:4":["141/2"],"2:3":["216/12"],"9B:4":["241/16"]}};
const KEY = "tropy-kr-v1";
const COUNTED_MAX = 6;

const name = s => DATA.names[s] || s.replace(/^Time Passes: Chapter (.+)$/, "时间流逝（第 $1 章）");
const part = p => p == null ? "" : " 部分 " + p;
const esc = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

const HEROES = ["Elgan", "Gerdwyn", "Iunis", "Osbert"];
let state = { owned: [], ch: { n: 1, letter: "", part: 0 }, heroes: [], onMap: [] };
// a state saved while the page still opened on example statuses is not the player's own
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.owned && !s.sample) state = s; } catch (e) {}
state.heroes = state.heroes || [];
state.owned = state.owned.map(k => k.endsWith("|") ? k + "1" : k);  // counted statuses used to be a single "Status|"
state.onMap = state.onMap || [];  // location cards on the table; empty means show every location
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const chN = document.getElementById("chN");
for (let i = 1; i <= 10; i++) chN.add(new Option(i, i));

function chapterText([a, b, letter, p, further]) {
  return "章节 " + a + (b !== a ? "–" + b : "") + letter + (p ? ", 部分 " + p : "") + (further ? " 或之后" : "");
}

function place(g) {
  const [loc, verse] = g.at.split("/");
  return g.locs.length ? g.locs : ["秘密之书条目 " + verse];
}

// where to reread a passage in the companion app; the page keeps only the numbers
const ref = at => {
  const [loc, verse] = at.split("/");
  // the app splits the Book of Secrets into two pseudo-locations, 999 (entries 0-600) and 1001 (601-1263)
  return loc === "999" || loc === "1001" ? "秘密之书条目 " + verse : `地点 ${loc}, 段落 ${verse}`;
};
const refs = ats => ats && ats.length ? `<p class="note">应用中的文本: ${ats.slice(0, 3).map(ref).join(" 或 ")}</p>` : "";

// the passage that sent the party into the current chapter part, or closed the previous chapter
function previousPart({ n, letter, part }) {
  const keys = part > 1 ? [`${n}${letter}:${part}`, `${n}:${part}`]
    : [`${n}${letter}:1`, `${n}:1`, `END ${n - 1}${letter}`, `END ${n - 1}`, `END ${n - 1}A`, `END ${n - 1}B`];
  for (const k of keys) if (DATA.chapter_refs[k]) return [k, DATA.chapter_refs[k]];
  return null;
}

function renderChapterIntro() {
  const found = previousPart(state.ch);
  const el = document.getElementById("chapterIntro");
  if (!found) {
    el.innerHTML = `<p class="note">我不知道结束上一部分的条目。请在页头设置章节和部分。</p>`;
    return;
  }
  const [k, ats] = found;
  const title = k.startsWith("END") ? "章节结束 " + k.slice(4) : "部分开始 " + k.replace(":", ", 部分 ");
  // a part can be reached from several branches; every entry is listed, the player knows which one they read
  el.innerHTML = `<p class="note">${esc(title)}: ${ats.map(ref).join(" 或 ")}</p>`;
}

function renderStory(owned, relevant) {
  // per thread: the recap of the highest part owned, earlier parts folded below it
  const parts = {};
  for (const k of owned) {
    const [s, p] = k.split("|");
    if (DATA.summaries[k]) (parts[s] = parts[s] || []).push(+p);
  }
  const threads = Object.entries(parts).map(([s, ps]) => [s, ps.sort((a, b) => a - b)])
    .sort((a, b) => name(a[0]).localeCompare(name(b[0]), "zh-Hans"));
  const html = ([s, ps]) => {
    const top = ps[ps.length - 1];
    const earlier = ps.slice(0, -1).map(p => `<li value="${p}">${esc(DATA.summaries[s + "|" + p])}</li>`).join("");
    return `<details class="thread"><summary><b>${esc(name(s))} <span class="num">部分 ${top}</span></b>${esc(DATA.summaries[s + "|" + top])}</summary>${refs(DATA.sources[s + "|" + top])}${earlier ? "<ol>" + earlier + "</ol>" : ""}</details>`;
  };
  // threads that open something on the table or hold a live hint come first; the rest fold away
  const now = threads.filter(([s]) => relevant.has(s)), older = threads.filter(([s]) => !relevant.has(s));
  document.getElementById("story").innerHTML = threads.length
    ? "<h2>发生了什么</h2>" +
      (now.length ? now.map(html).join("") : `<p class="note">目前没有任何故事线在你的地图上开启新内容。</p>`) +
      (older.length ? `<details class="older"><summary>较早的故事线 (${older.length})</summary>${older.map(html).join("")}</details>` : "")
    : "";
}

function renderGo() {
  const owned = new Set(state.owned);
  const ch = state.ch;
  renderChapterIntro();
  const onTable = locs => !state.onMap.length || !locs.length || locs.some(p => state.onMap.includes(p));
  const leads = activeLeads(DATA, owned).filter(l => onTable(l.locs));
  document.getElementById("leads").innerHTML = leads.length
    ? "<h2>游戏中的线索</h2>" + leads.map(l =>
        `<div class="lead">${esc(l.text)}<small>${ref(l.at)}</small></div>`).join("")
    : "";

  const byLoc = (list) => {
    const m = new Map();
    for (const g of list) for (const p of place(g)) {
      if (!m.has(p)) m.set(p, []);
      m.get(p).push(g);
    }
    return [...m].sort((a, b) => b[1].length - a[1].length || String(a[0]).localeCompare(String(b[0]), "zh-Hans", { numeric: true }));
  };
  const item = g => {
    const why = g.conds.filter(c => c[2]).map(([s, p]) => "你拥有 " + name(s) + part(p))
      .concat(g.heroes.length ? ["适用于: " + g.heroes.join(" 或 ")] : [], g.chapter.map(chapterText));
    const what = g.label ? esc(g.label.replace(/^\d+\s+/, "")) : "回到这里，有新内容等着你";
    return `<li>${what}<div class="why">${esc(why.join(" · "))}</div></li>`;
  };
  const card = ([p, gs]) => {
    const seen = new Set();
    const items = gs.map(item).filter(h => !seen.has(h) && seen.add(h));
    const title = typeof p === "number"
      ? `<span class=num>${p}</span> ${esc(DATA.loc_names[p] || "")}` : `<span class=num>${p}</span>`;
    return `<div class="loc"><h3>${title}</h3><ul>${items.join("")}</ul></div>`;
  };
  // book entries have no card, so they stay visible whatever is on the table
  const shown = list => byLoc(list).filter(([p]) => !state.onMap.length || typeof p !== "number" || state.onMap.includes(p));

  const open = openGates(DATA, owned, ch, new Set(state.heroes));
  const byStatus = open.filter(g => g.conds.some(c => c[2]));
  const byHero = open.filter(g => !g.conds.some(c => c[2]) && g.heroes.length);
  const byChapter = open.filter(g => !g.conds.some(c => c[2]) && !g.heroes.length);
  document.getElementById("heroGates").innerHTML = shown(byHero).length
    ? `<h2>适合你的角色</h2>` + shown(byHero).map(card).join("") : "";
  document.getElementById("gates").innerHTML = "<h2>由你的状态解锁</h2>" +
    (shown(byStatus).length ? shown(byStatus).map(card).join("") : `<p class="note">勾选的状态目前都没有开启新内容。</p>`);
  document.getElementById("chapterGates").innerHTML = shown(byChapter).length
    ? `<h2>本章新内容</h2>` + shown(byChapter).map(card).join("") : "";
  document.getElementById("mapNote").hidden = state.onMap.length > 0;

  const relevant = new Set(leads.flatMap(l => l.keys.map(k => k[0])));
  for (const [, gs] of shown(byStatus)) for (const g of gs) for (const c of g.conds) if (c[2]) relevant.add(c[0]);
  renderStory(owned, relevant);
}

function renderSheet() {
  const owned = new Set(state.owned);
  const q = document.getElementById("q").value.trim().toLowerCase();
  const all = Object.keys(DATA.max_part).filter(s => s !== "Time Passes")
    .sort((a, b) => name(a).localeCompare(name(b), "zh-Hans"));
  document.getElementById("list").innerHTML = all.filter(s => !q || name(s).toLowerCase().includes(q)).map(s => {
    const n = DATA.max_part[s];
    // a status without numbered parts is a tally: tapping 3 means "I hold three"
    const tally = !n;
    const parts = Array.from({ length: n || COUNTED_MAX }, (_, i) => i + 1);
    return `<div class="st"><b>${esc(name(s))}</b>${tally ? '<span class="note">数量</span>' : ""}<div class="chips">${parts.map(p =>
      `<button class="chip" data-k="${esc(s + "|" + p)}"${tally ? ' data-tally="1"' : ""} aria-pressed="${owned.has(s + "|" + p)}">${p}</button>`).join("")}</div></div>`;
  }).join("");
}

function render() {
  chN.value = state.ch.n;
  document.getElementById("chL").value = state.ch.letter;
  document.getElementById("chP").value = state.ch.part;
  document.getElementById("party").innerHTML = '<span class="ch">队伍</span>' + HEROES.map(h =>
    `<button class="chip" data-h="${h}" aria-pressed="${state.heroes.includes(h)}">${h}</button>`).join("");
  document.getElementById("tabSt").textContent = "状态 (" + state.owned.length + ")";
  document.getElementById("tabMap").textContent = "地图 (" + state.onMap.length + ")";
  document.getElementById("maplist").innerHTML = Object.entries(DATA.loc_names).map(([n, nm]) =>
    `<button class="chip" data-loc="${n}" aria-pressed="${state.onMap.includes(+n)}"><b class="num">${n}</b><span>${esc(nm)}</span></button>`).join("");
  renderGo();
  renderSheet();
}

function tab(view) {
  for (const [id, t] of [["go", "tabGo"], ["sheet", "tabSt"], ["map", "tabMap"]]) {
    document.getElementById(id).hidden = id !== view;
    document.getElementById(t).setAttribute("aria-selected", id === view);
  }
}
document.getElementById("tabGo").onclick = () => tab("go");
document.getElementById("tabSt").onclick = () => tab("sheet");
document.getElementById("tabMap").onclick = () => tab("map");

for (const [id, f] of [["chN", "n"], ["chL", "letter"], ["chP", "part"]])
  document.getElementById(id).onchange = e => {
    state.ch[f] = f === "letter" ? e.target.value : +e.target.value;
    save(); render();
  };
document.getElementById("q").oninput = renderSheet;
// each language is its own page; the saved state is shared, so the switch keeps it
const langSel = document.getElementById("lang");
langSel.hidden = langSel.options.length < 2;
langSel.onchange = () => { location.href = langSel.value; };

// state <-> text code (base64 of the JSON; encodeURIComponent keeps Polish letters intact)
const toCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(state))));
function fromCode(code) {
  const s = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  const ok = s && Array.isArray(s.owned) && s.owned.every(k => typeof k === "string") && s.ch && Number.isFinite(+s.ch.n);
  if (!ok) throw new Error("bad code");
  return { owned: s.owned, ch: { n: +s.ch.n, letter: s.ch.letter === "A" || s.ch.letter === "B" ? s.ch.letter : "", part: +s.ch.part || 0 },
    heroes: (s.heroes || []).filter(h => HEROES.includes(h)), onMap: (s.onMap || []).map(Number).filter(Number.isFinite), sample: false };
}
// link with the state in its #hash
const PAGE_URL = location.origin + location.pathname;
document.getElementById("copyLink").onclick = () => {
  const msg = document.getElementById("linkMsg"), code = encodeState(DATA, state), url = PAGE_URL + "#" + code;
  try { history.replaceState(null, "", "#" + code); } catch (e) {}
  navigator.clipboard.writeText(url).then(() => { msg.textContent = "链接已复制。"; },
    () => { const box = document.getElementById("code"); box.value = url; box.select(); msg.textContent = "链接在下面的输入框中，已选中以便复制。"; });
};

// opening a link with a state asks first: it would replace what this browser has saved
let linked = null;
function checkLink() {
  const code = decodeURIComponent(location.hash.slice(1));
  const banner = document.getElementById("fromLink"), msg = document.getElementById("fromLinkMsg");
  if (!code) return;
  if (!code.startsWith("t")) {
    // diagnostic: show what the viewer actually handed over instead of ignoring it
    msg.textContent = `链接给页面传入了一个标记“${code.slice(0, 20)}…” (${code.length} 个字符), 它不是游戏状态。`;
    document.getElementById("linkYes").hidden = true;
    banner.hidden = false;
    return;
  }
  try {
    linked = decodeState(DATA, code);
    if (!state.owned.length) {
      // nothing ticked here yet, so there is nothing to lose: load straight away
      state = linked; save(); render();
      msg.textContent = `已从链接载入状态: ${linked.owned.length} 个勾选, 章节 ${linked.ch.n}${linked.ch.letter}.`;
      document.getElementById("linkYes").hidden = true;
      document.getElementById("linkNo").textContent = "OK";
    } else {
      msg.textContent = `链接包含一个游戏状态: ${linked.owned.length} 个勾选, 章节 ${linked.ch.n}${linked.ch.letter}. 要用它替换当前状态吗 (${state.owned.length} 个勾选)?`;
      document.getElementById("linkYes").hidden = false;
      document.getElementById("linkNo").textContent = "保留我的";
    }
  } catch (e) {
    linked = null;
    msg.textContent = e.message === "version"
      ? "此链接来自旧版页面，无法读取。请索取新链接。"
      : `状态链接已损坏：页面收到 ${code.length} 个字符, 而完整链接约有 115 个。请重新完整复制。`;
    document.getElementById("linkYes").hidden = true;
  }
  banner.hidden = false;
}
document.getElementById("linkYes").onclick = () => {
  if (linked) { state = linked; save(); render(); }
  document.getElementById("fromLink").hidden = true;
};
document.getElementById("linkNo").onclick = () => { document.getElementById("fromLink").hidden = true; };
window.addEventListener("hashchange", checkLink);
// the service worker makes the page installable
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("/sw.js").catch(() => {});

document.getElementById("copyCode").onclick = () => {
  const box = document.getElementById("code"), msg = document.getElementById("copyMsg");
  box.value = toCode();
  navigator.clipboard.writeText(box.value).then(() => { msg.textContent = "已复制。"; },
    () => { box.select(); msg.textContent = "代码在下面的输入框中，已选中以便复制。"; });
};
document.getElementById("loadCode").onclick = () => {
  const msg = document.getElementById("loadMsg");
  try {
    state = fromCode(document.getElementById("code").value);
    save(); render();
    msg.textContent = "已载入: " + state.owned.length + " 个勾选.";
  } catch (e) {
    msg.textContent = "这不是有效的代码。请重新完整复制。";
  }
};
document.getElementById("maplist").onclick = e => {
  const b = e.target.closest("[data-loc]");
  if (!b) return;
  const n = +b.dataset.loc;
  state.onMap = state.onMap.includes(n) ? state.onMap.filter(x => x !== n) : [...state.onMap, n];
  save();
  b.setAttribute("aria-pressed", state.onMap.includes(n));
  document.getElementById("tabMap").textContent = "地图 (" + state.onMap.length + ")";
  renderGo();
};
document.getElementById("party").onclick = e => {
  const h = e.target.dataset && e.target.dataset.h;
  if (!h) return;
  state.heroes = state.heroes.includes(h) ? state.heroes.filter(x => x !== h) : [...state.heroes, h];
  save(); render();
};
document.getElementById("list").onclick = e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  const owned = new Set(state.owned);
  if (e.target.dataset.tally) {
    const [s, p] = k.split("|");
    const n = count(owned, s) === +p ? 0 : +p;  // tapping the current tally clears it
    for (let i = 1; i <= COUNTED_MAX; i++) i <= n ? owned.add(s + "|" + i) : owned.delete(s + "|" + i);
  } else owned.has(k) ? owned.delete(k) : owned.add(k);
  state.owned = [...owned];
  save();
  for (const b of e.target.parentNode.children) b.setAttribute("aria-pressed", owned.has(b.dataset.k));
  document.getElementById("tabSt").textContent = "状态 (" + state.owned.length + ")";
  renderGo();
};
render();
checkLink();
</script>
